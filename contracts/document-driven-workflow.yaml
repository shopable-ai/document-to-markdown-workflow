navigation_to_chain:
  P01: [C01, C02, C03]
  P02: [C02, C03, C04]
  P03: [C04]
  P04: [C05]
  P05: [C06, C07]
  P06: [C08, C09]
  P07: [C10, C11, C12, C13, C14, C15, C16, C17, C18]
  P08: [C20]
  P09: [C21, C22, C23]
  P10: [C24, C25, C26, C27]
  P11: [C28]
  P12: [C29]
  P13: [C33]
  P14: [C32, C35, C36]
  P15: [C34, C37, C38, C39]
  P16: [C40]
stages:
  - {id: P01, name: 项目来源与目标, required_question: 当前项目来源目标和范围是什么, artifacts: [raw-request, source-record, goal-scope], gate: source-and-goal-identifiable, projection: [requirements/discovery/RAW-REQUESTS.md, requirements/PROJECT-GOAL-AND-SCOPE.md]}
  - {id: P02, name: 原始需求事实与Unknown, required_question: 哪些是原话事实假设冲突和未知, artifacts: [raw-request, facts, unknowns], gate: facts-and-inference-separated, projection: [requirements/discovery/REQUIREMENT-DISCOVERY.md, requirements/REQUIREMENTS.md]}
  - {id: P03, name: 样例与反例, required_question: 什么结果可接受或不可接受, artifacts: [examples, counterexamples], gate: example-boundaries-declared, projection: [requirements/discovery/REQUIREMENT-DISCOVERY.md, requirements/ACCEPTANCE-AND-TEST-SPACE.md]}
  - {id: P04, name: AI需求发现, required_question: AI提出了什么候选和替代解释, artifacts: [candidate-requirements, reasoning-records], gate: candidate-traces-to-source, projection: [requirements/discovery/REQUIREMENT-DISCOVERY.md]}
  - {id: P05, name: 人工可读需求草稿, required_question: 目标需求和非目标是否可读, artifacts: [goal-scope, requirement-list, requirement-tree], gate: markdown-first-draft-complete, projection: [requirements/PROJECT-GOAL-AND-SCOPE.md, requirements/REQUIREMENTS.md]}
  - {id: P06, name: 业务范围确认, required_question: 哪个范围被合法确认, artifacts: [V1-record], gate: V1-confirmed, projection: [requirements/BASELINES.md]}
  - {id: P07, name: 完整需求模型, required_question: 场景功能行为状态和验收是否闭合, artifacts: [scenarios, functions, behaviors, acceptance, V2], gate: V2-confirmed, projection: [requirements/BUSINESS-SCENARIOS-AND-CHAINS.md, requirements/FUNCTIONS.md, requirements/BEHAVIOR-STATE-AND-TEMPORAL-SPECS.md, requirements/ACCEPTANCE-AND-TEST-SPACE.md]}
  - {id: P08, name: 候选方案与决策, required_question: 哪个方案和取舍被选择, artifacts: [research, candidate-decisions], gate: decision-rationale-recorded, projection: [design/SOLUTION-AND-ARCHITECTURE.md, references/]}
  - {id: P09, name: 架构与工程设计, required_question: 边界组件IO状态权限和错误如何实现需求, artifacts: [solution, architecture, engineering-design, V3], gate: V3-confirmed, projection: [design/SOLUTION-AND-ARCHITECTURE.md, design/ENGINEERING-DESIGN.md]}
  - {id: P10, name: 验证Spec与任务, required_question: 如何形成可验证的精确工程工作包, artifacts: [verification-design, specs, tasks, traceability], gate: traceability-closed, projection: [design/VERIFICATION-DESIGN.md, requirements/TRACEABILITY.md, execution/ENGINEERING-TASKS.md]}
  - {id: P11, name: Workflow, required_question: 已批准任务如何编排, artifacts: [workflow, stage-gates], gate: workflow-traces-to-task, projection: [workflow-registry.yaml, workflows/]}
  - {id: P12, name: 执行投影, required_question: 本次选哪些SkillToolModel和Context, artifacts: [projection-record], gate: current-authorized-projection, projection: [skill-registry.yaml, tool-registry.yaml, contracts/projection-record.yaml]}
  - {id: P13, name: 代表样例, required_question: 最小风险样例是否通过事前判据, artifacts: [smoke, calibration], gate: representative-risk-covered, projection: [tests/fixtures, tests/runs]}
  - {id: P14, name: Preflight受控运行与Evidence, required_question: 本次实际运行发生了什么, artifacts: [preflight, run, evidence], gate: terminal-evidence-complete, projection: [contracts/workflow-a-preflight.yaml, contracts/workflow-run-record.yaml, contracts/stage-evidence.yaml]}
  - {id: P15, name: ReadinessVerdictDelivery与Claim, required_question: 当前Evidence支持什么交付和声明, artifacts: [readiness, verdict, delivery, bounded-claim], gate: independent-verdict-current, projection: [contracts/acceptance-scorecard.yaml, requirements/TRACEABILITY.md]}
  - {id: P16, name: 反馈失效与重建, required_question: 哪些对象失效应从哪里重开, artifacts: [change-record, invalidation, retest, retrospective], gate: earliest-owner-updated-and-revalidated, projection: [governance/ARTIFACT-AND-CHANGE-GOVERNANCE.md, contracts/change-record.yaml]}
rules:
  - C01-C40-is-the-canonical-human-chain
  - P01-P16-is-derived-compressed-navigation
  - C19-is-brownfield-conditional-not-a-universal-start
  - downstream-artifacts-cannot-upgrade-unapproved-requirements
  - unknown-requires-owner-impact-and-resolution-entry
  - causal-relation-requires-basis-beyond-order
  - failed-or-stale-evidence-cannot-support-current-claim
  - AI-generator-cannot-self-approve-or-self-certify
