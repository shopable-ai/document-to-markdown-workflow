contract: gpt-image-generation-request
version: 0.1.0
description: Workflow B 的无秘密单图生成请求与结果登记契约。
required:
  request_id: string
  markdown_source:
    path: string
    section_selector: string
    content_digest: string
  visual_plan:
    intent: string
    structure: string
    density_decision: enum[accepted, reduced, needs-split]
    reconstruction_profile_id: string|null
  prompt:
    text: string
    version: string
  model:
    name: gpt-image-2
    size: string
    quality: string
  references: array
  output:
    count: 1
    path: string|null
    mime_type: string|null
  review:
    status: enum[pending, passed, needs-revision, failed]
  status: enum[planned, submitted, generated, reviewed, failed]
  usage:
    online_call_count: integer
    reference_asset_count: integer
    local_preprocessing: boolean
  quota_note: string
optional:
  - visual_reconstruction_profile:
      profile_id: string
      path: string
      mode: enum[structure-and-prompt, structure-only, prompt-only, insufficient-evidence]
      source_asset_id: string
      source_fingerprint: string
      status: enum[available, needs-review, not-applicable, unavailable]
  - prompt_derivation:
      profile_id: string|null
      source_fields: array
      unresolved: array
forbidden_fields:
  - api_key
  - authorization
  - cookie
  - secret
  - subscription_url
invariants:
  - output.count=1
  - usage.online_call_count is non-negative
  - status=reviewed implies review.status in [passed, needs-revision, failed]
  - visual_reconstruction_profile.path 存在时必须引用当前 generation-request 的 source asset，且不能把 profile 的 Unknown 字段改写成 confirmed
