contract: markdown-asset-package
id: markdown-asset-package
version: 0.4.0
human_reference: contracts/CONTRACTS.md#contract-markdown-asset-package
lifecycle_status: active
description: Workflow A 显式 --engineering-output 模式的完整资产包；默认 reader-only 输出使用 reader-markdown-output-layout。
output_layout: workflow-a-output-layout.yaml
required:
  package_id: string
  source:
    path_label: string
    media_type: string
    source_fingerprint: string
  markdown:
    path: string
    sections: array
  assets_manifest:
    path: manifest.yaml
    type: string
  processing:
    native_extraction: enum[complete, partial, unavailable]
    ocr_used: boolean
    visual_review: enum[not-requested, attempted, complete, partial, unavailable]
    execution_path: enum[native-only, mac96, mac96-direct-vision, mac96-with-conversation-online-fallback, conversation-online, conversation-online-vision, apple-vision-ocr, needs-review]
    fallback_reason: string|null
    status: enum[complete, needs-review, failed]
    stage_evidence: array
    stage_evidence_contract: string
    failure_report: string
  evidence:
    source_inventory: string
    capability_probe: string
    smoke_report: string
    progress: string
  validation:
    validator_version: string
    status: enum[passed, needs-review, failed]
    checks: array
optional:
  - visual_reconstruction_profiles
  - markdown_content_repair: reviews/markdown-content-repair.yaml
  - visual_asset_pruning: evidence/visual-asset-pruning.json
  - visual_asset_lifecycle: workflow F0-F8 task evidence + manifest.yaml assets + optional evidence/visual-reconstruction-profile.yaml + visual-asset-backfill evidence
  - figure_coverage: manifest.figure_coverage and optional evidence/figure-coverage.json
  - source_page_probes: optional evidence/source-page-probe-<id>.json
  - diagnostic_artifacts: optional engineering evidence records; never reader assets
  - historical_manifest_migration: optional evidence/historical-manifest-migration.json
visual_asset_lifecycle:
  required: [enabled, task_evidence, status]
  enabled: boolean
  task_evidence: array
  status: enum[complete, needs-review, failed, not-run]
visual_asset_lifecycle_task_evidence:
  required: [task_id, status, binding_status, evidence_paths, diagnostics]
  task_id: enum[F0, F1, F2, F3, F4, F5, F6, F7, F8]
  status: enum[complete, needs-review, failed, not-run]
  binding_status: string
  evidence_paths: array
  diagnostics: array
section_item:
  required: [section_id, title, body, source_occurrences, visual_asset_ids, confidence, reader_order, unknown_forms]
  confidence: enum[high, medium, low, unknown]
  source_occurrences: array
  visual_asset_ids: array
  unresolved: array
  reader_order: enum[semantic-before-visual, needs-review]
  unknown_forms: array
invariants:
  - 每个 visual_asset_id 必须存在于 manifest.yaml 的 assets 列表
  - source_fingerprint 只能用于追溯，不写入用户可见文件名
  - unresolved 和明确返回的 unknown_forms 不得被静默删除；没有候选时允许为空数组
  - complex-region/crop 是按需资产类型；整页来源图足够时不生成对应文件，但 A3 报告必须记录该判断
  - validation.status=passed 时不得存在断链或缺失 manifest 记录
  - processing.status=complete 且 validation.status=passed 时，native_extraction、visual_review、ocr_used 和 stage evidence 必须与 processing-report 一致
  - processing.stage_evidence 的每项必须满足 contracts/stage-evidence.yaml，且覆盖 A1–A7
  - processing.failure_report 必须指向同一输出包中的 failure-report.yaml
  - 任一必需阶段 evidence 缺失、status=not-run 或 evidence_level 不足时，不得将 package status 写为 complete
  - A1 stage evidence 必须包含 evidence/source-inventory.json；其 status=complete 只表示来源元数据可读，不表示内容质量通过
  - active source-runner manifest 的 evidence 必须指向 source-inventory.json、capability-probe.json、smoke-report.json 和 progress.jsonl；旧 fixture/legacy 包若缺少该映射只能保留为历史/夹具边界
  - deterministic execute 若未执行 capability probe、smoke gate、视觉/OCR或质量审计，必须保留对应 evidence 文件并将相关阶段标为 needs-review/not-run
  - evidence/progress.jsonl 必须记录至少 execution_preflight、source_inventory、native_extraction、source_rendering、markdown_assembly 和 independent_validation 的状态
  - mac96 运行可额外提供 evidence/progress-current.json 作为覆盖写入的最新状态快照；逐页详情保留在 evidence/progress-pNNN.json，不能把这些逐页记录重复追加进 progress.jsonl
  - needs-review 只能由真实失败、冲突、未裁决关系或明确未知形式触发；缺少可选 unknown_forms 字段本身不构成失败
  - index.md 只保留读者层语义和必要页面图链接；工程证据字段必须进入 evidence/、manifest.yaml 或 reports/
  - 若执行视觉资产语义筛选，manifest.evidence.visual_asset_pruning 必须指向满足 contracts/visual-asset-pruning.yaml 的报告；被移除读者层引用对应的来源资产、哈希、source_occurrences 和理由不得从 manifest 或报告中消失
  - 存在 reviews/markdown-content-repair.yaml 时必须符合 contracts/markdown-content-repair.yaml；`deferred` 和 `rejected` 的提取文字候选、页码或审核状态不得回写 index.md
  - visual_reconstruction_profiles 中的每个 profile 必须满足 contracts/visual-reconstruction-profile.yaml，并且 source.asset_id 必须存在于 manifest.yaml
  - 同源候选比较后只能生成一个业务 package；未选来源只能作为候选比较和差异证据保存
  - 启用图级资产升级时，同一 manifest.yaml 必须闭合 page-render → crop → optional enhanced-raster → optional Mermaid derived representation 的父子关系；任何派生项都不得替代或删除来源页证据
  - 图级升级的 stage evidence 必须覆盖 workflow.yaml 的 F0–F8，并保存每步 execution binding；procedure-only、无仓库 entrypoint 或 not-run 步骤不得被总状态升级为 code-backed complete
  - crop/complex-region 必须先有候选区域和 accepted crop decision；只有 geometry 合法而无四边复核和来源/crop 对照时不得 available
  - 可用 Mermaid 必须有语法、实际渲染、来源语义逐项对照和 PNG fallback 链接四类 passed 证据
  - 图级生命周期的主编辑目标必须是 page-unit、segment 或其他 manifest 登记的最小 content_unit_id；index.md/document-temp.md/final 只能从这些单元确定性生成，不得成为长期手工事实源
  - Mermaid 回填必须同时保留可解析到 manifest asset_id 的 PNG fallback；Mermaid 不可靠时只能链接 crop/enhanced PNG，不得强行生成节点或边
  - figure_coverage 不是第二个资产 Manifest；它只对账 raw/source units、cleaned/page units、派生 Markdown、现有 assets 和同一 manifest.yaml 中的图号需求及状态
  - 当前批次 passed 不得把 manifest.figure_coverage.document_status 升级为 passed；全书 expected figure ID 未全部分类、存在 missing/reference-missing/needs-review，或历史 success 尚未按当前门禁重验时，document_status 必须为 needs-review/failed
  - source page probe、contact sheet、放大图、节点子图、OCR probe、overlay 和比较预览只进入 evidence；不得复制到扁平读者 assets/，也不得被 Markdown reader binding 引用
  - 历史逐图 JSON/YAML 只能作为带路径与 SHA-256 的迁移证据；稳定资产记录必须合并到当前唯一 manifest.yaml，冲突或无法映射的历史状态进入 needs-review
  - visual_asset_lifecycle.enabled=true 时必须同时存在 F0–F8 task_evidence 和 figure_coverage；任一 task not-run/needs-review、coverage 未通过或视觉人工门未闭合时 lifecycle status 不得 complete
