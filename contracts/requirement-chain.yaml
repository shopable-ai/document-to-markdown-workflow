id: document-to-markdown-requirement-chain
version: 0.2.0
human_reference: contracts/CONTRACTS.md#contract-document-to-markdown-requirement-chain
lifecycle_status: awaiting-human-confirmation
title: 文档资产化 Markdown-first 需求交接投影
purpose: >-
  机器检查需求 Markdown、三次基线、派生索引和向设计/工程的交接门；
  本合同不定义、确认或改写业务需求。
status: awaiting-human-confirmation
semantic_authority:
  goal_scope:
    path: requirements/PROJECT-GOAL-AND-SCOPE.md
    document_id: PROJECT-GOAL-AND-SCOPE
    version: 0.3.0
  requirements:
    path: requirements/REQUIREMENTS.md
    document_id: REQUIREMENTS
    version: 0.3.0
  requirement_tree:
    path: requirements/REQUIREMENT-TREE.md
    authority: derived
  baselines:
    path: requirements/BASELINES.md
  scenarios:
    path: requirements/BUSINESS-SCENARIOS-AND-CHAINS.md
  functions:
    path: requirements/FUNCTIONS.md
    document_id: FUNCTIONS
    version: 0.3.0
  behaviors:
    path: requirements/BEHAVIOR-STATE-AND-TEMPORAL-SPECS.md
  acceptance:
    path: requirements/ACCEPTANCE-AND-TEST-SPACE.md
  traceability:
    path: requirements/TRACEABILITY.md
  discovery:
    paths:
      - requirements/discovery/RAW-REQUESTS.md
      - requirements/discovery/REQUIREMENT-DISCOVERY.md
    authority: reference-candidate
    default_after_V2: excluded
derived_indices:
  requirements:
    path: requirements/requirements.index.yaml
    generated_from: requirements/REQUIREMENTS.md
    do_not_edit: true
  functions:
    path: requirements/functions.index.yaml
    generated_from: requirements/FUNCTIONS.md
    do_not_edit: true
baseline_gates:
  V1:
    current_status: pending-human-reconfirmation
    permits: [scenario-function-behavior-acceptance-elaboration]
    forbids: [formal-solution-design, spec, engineering-task, production-run]
  V2:
    current_status: blocked-by-V1
    permits_after_confirmed: [solution-and-architecture-design, brownfield-gap-analysis]
    forbids_before_confirmed: [architecture-baseline, formal-spec, engineering-task]
  V3:
    current_status: blocked-by-V2
    permits_after_confirmed: [formal-spec, engineering-task, workflow-projection, implementation]
canonical_objects:
  - Requirement
  - Scenario
  - Function
  - Behavior
  - Acceptance
  - Design
  - Spec
  - Task
  - Workflow
  - Code
  - Test
  - Run
  - Evidence
  - Verdict
  - Delivery
  - Claim
rules:
  - markdown-business-semantics-precede-machine-projection
  - requirement-tree-cannot-create-requirements
  - function-tree-cannot-create-functions
  - generated-index-cannot-overwrite-markdown
  - workflow-code-test-and-run-cannot-confirm-requirements
  - unknown-requires-owner-impact-resolution-entry
  - V1-before-V2-before-V3
  - V3-before-formal-spec-and-task
  - run-success-is-not-verdict
  - stale-evidence-cannot-support-claim
handoff:
  current_status: blocked
  reason: V1-V2-V3-not-confirmed
  allowed_now:
    - edit-and-review-requirement-markdown
    - refresh-derived-indices
    - validate-links-and-contract-pairs
    - read-only-brownfield-gap-analysis
  forbidden_now:
    - treat-existing-workflow-as-approved-requirement
    - run-real-document-conversion
    - issue-production-claim
