id: temporal-case
version: 0.1.0
title: 时序、状态与因果案例契约
purpose: >-
  将事件、状态迁移、顺序关系、分支、恢复和失败回退分开记录；禁止从先后顺序静默推导因果。
status: design-active
required: [case_id, trigger, preconditions, events, relations, decision_points, branches, recovery, terminal_states, unknowns]
event:
  required: [event_id, event_type, actor_ref, action, stage_ref, input_refs, output_refs, state_before, state_after, evidence_refs, observed_order, relation_status]
  relation_status: [observed, inferred, unknown]
relation:
  required: [relation_id, from_event, to_event, order_type, basis, evidence_refs]
  order_types: [temporal, causal, dependency, priority, reading, execution]
  basis_values: [observed, inferred, declared, observed-order-only]
  causal_gate:
    requires_any: [mechanism_ref, rule_ref, contrast_ref]
    requires_evidence_refs: true
    rejects_basis: observed-order-only
branch:
  required: [branch_id, guard, join_condition]
  optional: [mutual_exclusion]
recovery:
  required: [recovery_id, retry_of, max_attempts, rollback_to_state]
terminal_state:
  required: [name, entry_condition, reopen_from]
failure_routing:
  required: [failure_id, event_ref, symptom, evidence_refs, earliest_owner_layer, owner_artifact_ref, reopen_from_stage, blocking_reason]
  owner_layers: [D1, D2, D3, D4, D5, D6, D7, D8, P01, P02, P04, P06, P07, P09, P10, P11, P12, P14, P15, P16, A1, A2, A3, A4, A5, A6, A7, B1, B2, B3, B4, B5, B6, B7]
invariants:
  - 缺 state_before/state_after 的事件不得声明状态迁移
  - 仅有 observed_order 的关系只能是 temporal 或 unknown，不得是 causal
  - causal 必须同时有 evidence_refs 和 mechanism_ref/rule_ref/contrast_ref 之一
  - failure 必须回到最早责任层，不能用末端 retry 替代 owner_artifact_ref 和 reopen_from_stage
  - 并行事件必须有 concurrency_group 或明确 join_condition；缺失时 fail-closed
