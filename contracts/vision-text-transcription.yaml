contract: vision-text-transcription
id: vision-text-transcription
version: 0.2.0
human_reference: contracts/CONTRACTS.md#contract-vision-text-transcription
lifecycle_status: compatibility-only
description: vision-page-analysis 文字模式的兼容契约；实际路线由真实页面基准决定，不保留历史固定 fallback 顺序。
status: compatibility-only
superseded_by: contracts/vision-page-analysis.yaml
authorization:
  mac96:
    required: local-resource
    default: calibration-candidate
  online_provider:
    id: conversation-online-vision-text-transcription
    required: current-task-explicit
    default: explicit-current-task-only
    authorization: explicit-current-conversation
    input_scope: current-image-only
input:
  required: [input_asset_id, source_fingerprint, image_sha256, page_or_region, prompt_version]
  image_count: 1
  allowed_input: current-page-render-or-current-region-crop-only
  prohibited_context: [other-files, previous-image, next-image, other-page-body, ocr-json, bbox, confidence, manifest]
transport:
  mac96_candidate:
    type: ssh
    target: mac96
    endpoint: http://127.0.0.1:11434/api/generate
  conversation_candidate:
    type: current-conversation
    target: current-conversation
    trigger: explicit-authorized-comparison-or-selected-fallback
    adapter: none-direct-current-vision-model
    input_scope: one-current-page-or-region-image-only
  apple_vision_candidate:
    type: local-system
    target: apple-vision-ocr
    requires_structure_reconstruction: adapters/ocr_markdown_structure.py
prompt:
  source: references/prompts/vision-text-transcription-mac96.zh.txt
  skill: skills/vision-text-transcription/SKILL.md
  version: vision-text-transcription-v1
  policy: direct-vision-only-no-ocr
output:
  format: markdown-only
  layer: candidate
  evidence_path: evidence/vision-text-transcription.json
  required: [input_asset_id, source_fingerprint, image_sha256, page_or_region, prompt_version, transport, target, model, requested_at, candidate_markdown, status, diagnostics]
  status: enum[complete, unavailable, failed]
fallback:
  ordered: none-fixed-priority-forbidden
  selection: real-benchmark-and-page-quality-gates
  terminal_on_all_failures: failed
  needs_review_is_not_fallback: true
forbidden_fields: [api_key, authorization, cookie, secret, subscription_url]
invariants:
  - 每次请求只能读取并上传一张当前页面图或当前区域图
  - mac96、小视觉模型与 Apple Vision OCR 加结构重建都是候选路线；不得预设固定主次
  - 当前对话在线视觉模型只有当前任务明确授权时参与比较或回退
  - 不调用 OCR，不读取其他文件，不参考前后图片或其他页面文字
  - candidate_markdown 只能包含图片实际可见的文字和可直接确认的关系；无法确认的文字必须写为〔无法确认〕
  - 不得新增定义、选择关系、解读、总结或图片中没有的标题
  - 结果不得覆盖原始图片、原生文字或原始 OCR 证据
  - 提取阶段必须保留微信号、推广语、二维码附近说明及其他可见异常文字，不得执行广告删除或改写
  - mac96、当前对话在线视觉模型与 Apple Vision OCR 均失败时必须输出 failed/unavailable 证据，不自动伪造 needs-review
  - 记录模型标识、请求时间和输入指纹，但不得记录密钥、认证信息或订阅地址
