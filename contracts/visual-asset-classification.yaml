contract: visual-asset-classification
version: 0.2.0
description: mac96 对页面图执行的只读视觉资产语义分类候选报告。
required: [schema, version, status, mode, source_fingerprint, prompt_version, prompt_path, prompt_sha256, target, selected_pages, decisions, apply, diagnostics]
status: enum[complete, needs-review, failed]
mode: enum[candidate-only]
decision:
  required: [page, asset_id, file_path, sha256, source_fingerprint, decision, reason_codes, confidence, semantic_text_coverage, visual_increment, rationale]
  decision: enum[retain, crop-required, candidate-remove, needs-review]
  confidence: enum[high, medium, low, unknown]
  reason_codes: enum[cover, table-of-contents, text-covered, mixed-text-visual, diagram, table, flow, color-coded-structure, relation-dense-layout, needs-review]
invariants:
  - source_fingerprint 必须与 manifest.yaml.source.source_fingerprint 相等
  - mode 必须为 candidate-only，报告不得授权或执行删除
  - 每个 selected_pages 必须恰有一个 decisions 记录；缺失来源资产时 decision 必须为 needs-review
  - candidate-remove 只有在语义文字覆盖为 complete、视觉增量为 none 且理由为 cover/table-of-contents/text-covered 时才可成立
  - 页面同时含可由 Markdown 覆盖的大量正文和局部复杂视觉时必须为 crop-required；不得用 retain 把整页工程截图永久留在 reader assets
  - crop-required 必须满足 visual_increment=present，并在删除整页工程图前通过 region-cropping 的至少 95 分质量门
  - 传输失败、响应不可解析或无法区分关系结构时必须为 needs-review
  - sha256 必须是来源页面图应用前的实际哈希；分类报告不得修改来源资产
