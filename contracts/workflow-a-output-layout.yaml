contract: workflow-a-output-layout
id: workflow-a-output-layout
version: 0.2.0
human_reference: contracts/CONTRACTS.md#contract-workflow-a-output-layout
lifecycle_status: active
description: Workflow A 显式 --engineering-output 模式的完整工程交付目录；默认 reader-only 转换不使用此布局。
root: <output_root>/<package-name>/
required_files:
  - index.md
  - manifest.yaml
  - reports/processing-report.yaml
  - reports/acceptance-report.yaml
  - reports/failure-report.yaml
optional_files:
  - reports/validation-result.json
  - reports/quality-report.yaml
  - reports/markdown-post-merge-formatting.json
  - evidence/preflight.json
  - document-temp.md
required_directories:
  - assets/
optional_directories:
  - evidence/
  - ocr/
  - reviews/
semantic_roles:
  index.md: 最终可阅读、可检索的 Markdown 主文档
  manifest.yaml: 资产、来源出现位置、哈希、命名和链接登记
  reports/processing-report.yaml: 处理模式、工具版本、OCR/视觉复核状态和失败/警告
  reports/acceptance-report.yaml: 最终资产包验收结果
  reports/failure-report.yaml: 失败、降级和未决事项；无失败时输出 status=none 的空报告
  reports/validation-result.json: 独立验收器重新读取资产包后的最终状态和下一步依据
  document-temp.md: 当前已验收页面单元的确定性派生预览，不是最终事实来源
  page-units/p<page-3-digits>.md: 每页视觉证据对应的独立读者层 Markdown 工作单元；mac96 分页执行路径必须逐页生成
  assets/: 所有实际生成的视觉资产；目录必须扁平，资产类型通过 manifest.assets[].asset_kind 区分
  evidence/visual-reconstruction-profile.yaml: 复杂视觉资产的结构版与可复用提示词；不能替代原始资产或独立图片验收
invariants:
  - 新运行必须写入 output_layout=flat-assets-v1；assets/ 下不得创建 pages/、regions/、embedded/ 或其他嵌套目录
  - page-render、embedded-media、complex-region、crop 和 input-image 统一直接落在 assets/；不得用目录名替代 manifest.asset_kind
  - index.md 必须引用 manifest 中存在的资产 ID 或相对路径
  - index.md 每个 section 的语义文字和关系说明必须出现在视觉资产链接之前
  - 明确存在未裁决 unknown_forms、冲突或视觉复核失败时，reports/acceptance-report.yaml.status 不得为 passed
  - model 未返回可选 unknown_forms 字段、未执行开放集合扫描或整页图已足够时，不得单独制造 needs-review；A4 必须记录实际复核范围和原因
  - manifest.yaml 不得被 tests/runs/<run-id>/ 中的测试记录替代
  - reports/acceptance-report.yaml.status=passed 才能将包标记为 complete
  - reports/failure-report.yaml 必须存在；存在 P0、provenance-missing 或 integrity-check-failed 时 acceptance 不得为 passed
  - evidence/preflight.json 只证明执行前门禁，不得替代 reports/validation-result.json
  - 过程证据可进入 evidence/，但不能代替 index.md、manifest.yaml 或 reports/
  - mac96 分页执行路径中，每个已完成页面必须同时存在 vision-page-analysis JSON、vision-text-transcription JSON 和 page-units Markdown
  - page-units/ 只能包含显式处理的页面；不得为修复一页把其他页面正文写入当前单元
  - document-temp.md 必须由页面单元按固定页码顺序确定性合并，不得覆盖 index.md
  - 合并后的终态整理发生在 document-temp.md 之后、index.md 落盘之前；该步骤只能做保守 Markdown 整理，不得改图片路径、页面顺序或把同内容终稿复制成第二个 Markdown 文件名
  - 启用模型终态整理时必须遵守 markdown-post-merge-model-routing 契约；所有模型输出通过页面标记、图片引用、长度和围栏守卫后才能原子写入 index.md
