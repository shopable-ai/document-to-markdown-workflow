contract: workflow-a-production-runtime-context
id: workflow-a-production-runtime-context
version: 1.3.0
human_reference: contracts/CONTRACTS.md#contract-workflow-a-production-runtime-context
lifecycle_status: active
status: active
description: Workflow A 的精简生产运行投影；让执行器调用稳定接口，而不是重新读取需求史、Workflow 全文或 Python 实现。

applies_when:
  trigger: 文档转 Markdown
  mode: production-execution
  excludes: [workflow-design, code-change, root-cause-debugging]

default_context:
  load:
    - 当前用户输入中的 source 或 PDF 来源清单、output_root、pages
    - 本契约
  load_when_needed:
    - workflow-registry.yaml 中 document-to-markdown-assets 的 execution_entrypoint、pdf_collection_entrypoint、default_pages、production_runtime_contract
    - contracts/workflow-a-source-runner.yaml
    - contracts/workflow-a-output-layout.yaml
    - 当前运行的 progress-current.json
    - 当前失败页的 progress-pNNN.json
    - 当前运行的 reports/validation-result.json
  do_not_load_by_default:
    - .prompt/**
    - prompts/**
    - requirements/PROJECT-GOAL-AND-SCOPE.md
    - requirements/REQUIREMENT-TREE.md
    - execution/ENGINEERING-TASK-TREE.md
    - design/WORKFLOW-MAP.md
    - design/WORKFLOWS.md
    - README.zh.md
    - references/**
    - workflows/document-to-markdown-assets/workflow.yaml
    - skills/**/SKILL.md
    - adapters/**/*.py
    - tests/**
    - archive/**
    - .audit/**
    - 非当前 runs/**

execution:
  entrypoint: python3 adapters/workflow_a_source_runner.py --source <non-pdf-file> --output-root <dir> --pages <selector> --execute
  media_routes:
    pdf:
      entrypoint: python3 adapters/lan_pdf_markdown_graph.py --source <pdf> --run-root <exact-run-root> --pages <selector>
      default_mode: page-hybrid
      page_routes: [native-only, native-plus-visual, visual-only]
      visual_worker_recovery: probe-exact-installed-LAN-model; on-unavailable-or-failed-request-use-local-OCR-in-a-separate-attempt; verify-and-retain-source-render-and-raw-OCR; keep-reader-gate
      local_ocr_render_opt_in:
        environment: WORKFLOW_APPLE_VISION_FAST_PNG=1
        activation: inherited-at-safe-worker-start-or-resume; leave-already-running-worker-alone
        raster: same Poppler RGB pixels and DPI; bounded in-memory frame, lossless PNG, legacy-render fallback
        evidence: reuse-existing-assets-without-reencoding; hash-and-validate-new-bytes-in-their-own-package
        applies_to: newly-rendered Apple Vision pages only; no changes to route, OCR, or acceptance
      reader_visual_gate: verify-final-page-text-and-order-including-unrendered-pages; lock-v3-local-second-ocr-for-eligible-scans; preserve-scan-fallback-without-independent-transcription
      reader_scan_collection_concurrency: up-to-four-local-pages-within-one-book; independent-validation-replays-offline
      explicit_full_visual: --visual-only
      existing_run_resume: pass-the-exact-run-root-and---resume
      no_prompt_rule_repetition: true
      editable_book_markdown:
        scope: accepted-full-pdf-native-or-page-hybrid
        canonical: index.md
        location: <package>/<source-title>.md
        policy: byte-for-byte-copy-after-acceptance; strip-outer-book-title-marks; create-once; preserve-manual-edits
        purpose: per-book-formatting-and-web-import; not-acceptance-evidence-or-collection-export
      batch_packages:
        new_batch_run_root: <output-root>/conversions/<route>/<package>
        copy_source_ancestry_into_output: false
        resume: use-registered-exact-run-root
        relocate_active_packages: false
    docx:
      entrypoint: python3 adapters/workflow_a_source_runner.py --source <docx> --output-root <dir> --pages all --execute
      default_mode: local-pandoc-whole-document-native
      background_task_type: workflow-a
      validator: adapters/validate_docx_markdown.py
      outputs: [index.md, optional-flat-assets, reports/validation-result.json]
      pagination: Word metadata is a hint; no partial selector or page-render claim
      image_only: keep native image order and bytes; needs-review; no OCR by this route
      engineering_output_supported: false
    non_pdf:
      entrypoint: python3 adapters/workflow_a_source_runner.py --source <file> --output-root <dir> --pages <selector> --execute
  pdf_collection:
    applies_to: at-least-two-pdfs-including-the-pdf-subset-of-mixed-input
    entrypoint: python3 adapters/pdf_background_task.py start --task-type pdf-collection --source-list <list> --output-root <root> --route <hybrid|native-only> --pages all
    parameter_discovery: python3 adapters/pdf_background_task.py start --help
    source_list: UTF-8; one absolute PDF path per line
    routes: [hybrid, native-only]
    recommended_explicit_route: hybrid
    hybrid_mode: existing-page-hybrid
    native_only_requires: route-preflight-approval
    full_visual_supported: false
    queue: serial; one-independent-package-per-source
    pages: all by default; explicit selectors allowed but do not imply full-source acceptance
    mixed_inputs: 按类型分流；单份 PDF 与非 PDF 继续使用对应单来源入口，不自动配对。
    forbidden_substitutes: [ad-hoc-conversion-loop, ad-hoc-background-script, native-pdf-batch, blocked-generic-workflow-a-batch]
    new_batch_root: <output-root>/conversions/<route>
    adopt_existing_batch: --run-root <existing-exact-registered-official-route-batch-root>
    lifecycle:
      identity: stable-run-id-derived-from-exact-batch-root; manual --run-id unsupported
      admission: hold-official-collection-lock-before-started; transfer-lock-to-detached-worker
      start_without_launch:
        active_same_root: already-running
        active_other_route_holding_collection_lock: collection-busy
        unmanaged_queue: report existing lock owner without fabricating run_id or cancel_command
        inactive_registered: already-registered; return existing_status and resume_command
      resume: retain route, source list and packages; revalidate original batch registration evidence; completed queues may also resume in place and skip strictly accepted sources
      missing_registration: once-registered-refuse-resume-without-manifest
      disk_precheck: --min-free-bytes defaults to 2147483648; check only before starting the next PDF; pause if below threshold and resume with the same setting after freeing space; no in-book guarantee
      status_command: status <run_id>
      status_fields: [batch_summary, active_source, strict_accepted_count, halt_reason, current_phase, phase_source, current_page, progress_checkpoint]
      mode: detached-silent
    acceptance:
      before_cross_route_continuation: read _current, refresh _consolidated/source-consolidation.json from all registered run roots, and continue only sources not strict accepted
      reader_collection_export: requires 100-percent source-level strict acceptance; one route batch completing is not collection acceptance
  parameter_discovery: python3 adapters/workflow_a_source_runner.py --help
  default_pages: all
  source_isolation: one-source-per-run
  source_code:
    default: do-not-inspect
    rule: 把 Python 适配器视为黑盒执行单元；正常生产执行不得通过读取源码理解参数、阶段或输出。
    inspection_triggers:
      - 用户明确要求修改或审查代码
      - 命令执行失败且 stderr 已定位到相关模块
      - 实际 CLI 或输出与已登记契约不一致
    failure_scope: 先读 stderr、--help 和失败报告；仍不足时只读取被定位脚本的相关函数，不展开其他适配器。
  long_tasks:
    threshold_seconds: 30
    interaction_contract: contracts/long-task-interaction.yaml
    manager: python3 adapters/pdf_background_task.py start --task-type <native-pdf|native-pdf-batch|local-ocr-pdf|hybrid-pdf|visual-pdf|workflow-a>
    pdf_default_task_type: hybrid-pdf
    pdf_collection_task_type: pdf-collection
    default_mode: detached-silent
    after_start: 返回一次启动结果摘要后立即结束当前交互，不持续 write_stdin、ps 或进度文件轮询。

observability:
  before_run: [source_path, media_type, sha256, total_pages, selected_pages]
  during_run:
    first_read: progress-current.json
    page_detail: 只在该页失败或低置信度时读取 progress-pNNN.json
    never_bulk_read: progress.jsonl
    read_trigger: 仅用户明确查询、需要用户决策或检测到真实异常时读取；不得为保持关注主动读取。
    dialogue_forwarding: 工具轮询结果和逐页 stdout 不得转发到当前对话。
  after_run: [status, package_path, processed_pages, validator_status, validation_result_path]
  statuses: [passed, needs-review, failed]

acceptance:
  passed_requires: independent-validator-passed
  needs_review: 保留当前包和失败证据，仅加载失败页或低置信度页继续处理。
  failed: 不得声称转换完成；先根据 stderr 和失败报告缩小故障范围。

invariants:
  - 原始需求、推理过程、设计说明、历史提示词和测试材料是开发期输入，不是常规生产上下文。
  - Workflow 与契约已经固化的行为不得在每次生产运行时重新推理。
  - 正常生产运行只传递当前输入、当前状态摘要和最终验收摘要，不传递源码正文或全量事件流。
  - 读取被排除文件必须由明确触发条件支持；不得以熟悉实现为由预读 Python 源码。
  - 超过 30 秒的任务默认后台静默运行；启动、异常、用户查询、完成和取消之外不得产生对话消息。
  - PDF 默认进入 page-hybrid；纯文字页不调用视觉模型，只有显式批准才允许 --visual-only 全书路线。
  - PDF 页面失败必须继续后续页面并进入最终 page-completion 覆盖报告；不得把未完成页面藏在总状态中。
  - 同一来源已有 run root 时优先按来源哈希和页面路线记录复用，不创建替代运行目录掩盖已有完成页。
