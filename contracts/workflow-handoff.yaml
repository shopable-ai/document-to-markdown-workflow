contract: workflow-handoff
id: workflow-handoff
version: 0.1.0
human_reference: contracts/CONTRACTS.md#contract-workflow-handoff
lifecycle_status: active
description: Workflow A 向 Workflow B 可选传递 Markdown 片段和来源视觉资产的最小交接契约。
producer: document-to-markdown-assets
consumer: markdown-to-gpt-image
optional: true
required:
  handoff_id: string
  source_package_id: string
  source_fingerprint: string
  markdown:
    path: string
    section_id: string
    content_digest: string
  visual_assets: array
  reconstruction_profiles: array
  provenance:
    manifest_path: string
    generated_by_workflow: string
    generated_at: string
  status: enum[available, needs-review, unavailable]
forbidden_fields:
  - api_key
  - authorization
  - cookie
  - secret
  - subscription_url
invariants:
  - generated_by_workflow=document-to-markdown-assets
  - visual_assets 中的每个 asset_id 必须能在 manifest_path 找到
  - reconstruction_profiles 中的每个 profile_id 必须能在 manifest_path 或 profile path 找到，并且 source.asset_id 必须属于 visual_assets
  - status=available 时 markdown.path 和 manifest_path 必须存在
  - handoff 不授予复制来源版式或注册通用模板的权限
