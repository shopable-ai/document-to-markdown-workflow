version: 1.0.0
description: 通用 page-unit 边界噪声 profile；来源专用页眉文字通过运行级 profile 扩展，不写入本文件。
zones:
  header_nonempty_lines: 6
  footer_nonempty_lines: 6
  adjacent_line_window: 4
discovery:
  enabled: true
  minimum_occurrences: 3
  minimum_page_ratio: 0.02
  minimum_cooccurrences: 2
  fuzzy_similarity: 0.84
header_rules: []
protected_exact:
  - 正文
  - 视觉补充
  - 列表/图示文字
  - 表格与公式
  - 解读
  - 举例与思考
  - 模型结构
  - 已确认的关系说明
  - 原始页面图
  - 待核对项
  - 暂无待核对项。
  - 暂无已确认的关系说明。
