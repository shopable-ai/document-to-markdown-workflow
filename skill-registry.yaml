registry: skill-registry
id: skill-registry
version: 0.1.0
human_reference: contracts/CONTRACTS.md#yaml-skill-registry
lifecycle_status: active
description: Workflow 阶段引用的可复用 Skill 注册表；条目可以是正式 Skill 或指向正式 Skill 的兼容别名。
schema:
  required_entry_fields: [id, path]
  compatibility_entry_fields: [kind, maps_to_workflow, profile, alias_of]
  path_must_exist: true
  frontmatter_name_must_equal_id: true
  stage_references_must_be_registered: true
  entrypoint_skills: [document-asset-extraction, document-visual-generation, knowledge-map-image-to-md, native-pdf-to-markdown]
skills:
  - id: source-inventory
    path: skills/source-inventory/SKILL.md
  - id: pptx-xml-extraction
    path: skills/pptx-xml-extraction/SKILL.md
  - id: pdf-layout-extraction
    path: skills/pdf-layout-extraction/SKILL.md
  - id: docx-structure-extraction
    path: skills/docx-structure-extraction/SKILL.md
  - id: embedded-media-extraction
    path: skills/embedded-media-extraction/SKILL.md
  - id: page-rendering
    path: skills/page-rendering/SKILL.md
  - id: complex-region-detection
    path: skills/complex-region-detection/SKILL.md
  - id: region-cropping
    path: skills/region-cropping/SKILL.md
  - id: local-ocr
    path: skills/local-ocr/SKILL.md
  - id: vision-page-analysis
    path: skills/vision-page-analysis/SKILL.md
  - id: text-source-reconciliation
    path: skills/text-source-reconciliation/SKILL.md
  - id: layout-relation-reconciliation
    path: skills/layout-relation-reconciliation/SKILL.md
  - id: vision-text-transcription
    path: skills/vision-text-transcription/SKILL.md
    kind: compatibility-alias
    alias_of: vision-page-analysis
  - id: mac96-visual-review
    path: skills/mac96-visual-review/SKILL.md
    kind: compatibility-alias
    alias_of: vision-page-analysis
  - id: markdown-structure-builder
    path: skills/markdown-structure-builder/SKILL.md
  - id: page-markdown-unit
    path: skills/page-markdown-unit/SKILL.md
  - id: clean-page-markdown-noise
    path: skills/clean-page-markdown-noise/SKILL.md
  - id: prune-low-value-ebook-pages
    path: skills/prune-low-value-ebook-pages/SKILL.md
    scope: optional-post-complete-page-unit-merge-pre-knowledge-base-export
    entrypoint: python3 skills/prune-low-value-ebook-pages/scripts/prune_ebook_pages.py
    contract: contracts/ebook-page-pruning.yaml
  - id: markdown-content-repair
    path: skills/markdown-content-repair/SKILL.md
  - id: markdown-format-repair
    path: skills/markdown-format-repair/SKILL.md
  - id: source-asset-linker
    path: skills/source-asset-linker/SKILL.md
  - id: uncertainty-marking
    path: skills/uncertainty-marking/SKILL.md
  - id: semantic-asset-naming
    path: skills/semantic-asset-naming/SKILL.md
  - id: source-occurrence-registration
    path: skills/source-occurrence-registration/SKILL.md
  - id: asset-deduplication
    path: skills/asset-deduplication/SKILL.md
  - id: semantic-visual-asset-pruning
    path: skills/semantic-visual-asset-pruning/SKILL.md
    modes: [workflow-a, reader-only-markdown-package, standalone-image-corpus]
    standalone_entrypoint: python3 skills/region-cropping/scripts/audit_text_heavy_reader_assets.py <image-corpus-root> --mode standalone-image-corpus --evidence-dir <evidence-dir>
  - id: asset-package-validation
    path: skills/asset-package-validation/SKILL.md
  - id: native-pdf-to-markdown
    path: skills/native-pdf-to-markdown/SKILL.md
  - id: native-epub-to-markdown
    path: skills/native-epub-to-markdown/SKILL.md
    scope: native-epub-reader-markdown-extraction
    entrypoint: python3 skills/native-epub-to-markdown/scripts/epub_to_markdown.py
  - id: pdf-route-detection
    path: skills/pdf-route-detection/SKILL.md
    scope: pre-conversion-document-routing-and-runtime-page-hybrid-routing
    entrypoint: python3 adapters/pdf_route_detection.py
    page_hybrid_entrypoint: python3 adapters/lan_pdf_markdown_graph.py --source <pdf> --run-root <exact-run-root> --pages <selector>
    contract: contracts/pdf-route-detection.yaml
    run_root: runs/pdf-route-detection
    reader_summary: PDF转换路线总览.md
  - id: markdown-asset-copy
    path: skills/markdown-asset-copy/SKILL.md
    modes: [single_markdown, collection_merge]
    collection_merge_entrypoint: python3 adapters/markdown_collection_merge.py
    collection_merge_contract: contracts/markdown-collection-output-layout.yaml
  - id: markdown-section-selector
    path: skills/markdown-section-selector/SKILL.md
  - id: visual-use-case-classifier
