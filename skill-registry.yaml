  - id: gpt-image-2-generation
    path: skills/gpt-image-2-generation/SKILL.md
  - id: generated-image-review
    path: skills/generated-image-review/SKILL.md
  - id: document-asset-extraction
    path: skills/document-asset-extraction/SKILL.md
  - id: document-visual-generation
    path: skills/document-visual-generation/SKILL.md
  - id: knowledge-map-image-to-md
    path: skills/knowledge-map-image-to-md/SKILL.md
    kind: compatibility-entrypoint
    maps_to_workflow: document-to-markdown-assets
    profile: references/knowledge-map-profile.zh.md
