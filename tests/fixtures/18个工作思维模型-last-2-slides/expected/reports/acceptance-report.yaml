  - stage_id: A6
    status: needs-review
    evidence_level: L2-fixture-contract
    evidence_paths: [manifest.yaml]
    verification_commands: [RUNTIME_PY=... "$RUNTIME_PY" tests/run_fixture_contract_tests.py]
