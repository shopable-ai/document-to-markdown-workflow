status: needs-review
evidence_level: L2-fixture-contract
checks:
  - name: selected_pages
    status: passed
  - name: required_text
    status: passed
  - name: visual_baselines
    status: passed
  - name: full_parser_execution
    status: not-run
  - name: ocr_execution
    status: not-run
note: 夹具验收通过不等于生产解析器验收通过。
stage_evidence:
  - stage_id: A1
    status: needs-review
    evidence_level: L2-fixture-contract
    evidence_paths: [fixture.yaml]
    verification_commands: [RUNTIME_PY=... "$RUNTIME_PY" tests/run_fixture_contract_tests.py]
    diagnostics: [只验证选页边界]
    unknown: [真实来源预检]
  - stage_id: A2
    status: needs-review
    evidence_level: L2-fixture-contract
    evidence_paths: [selected/18个工作思维模型-第24-25页.pptx]
    verification_commands: [RUNTIME_PY=... "$RUNTIME_PY" tests/run_fixture_contract_tests.py]
    diagnostics: [只验证关键文字]
    unknown: [完整原生结构]
  - stage_id: A3
    status: needs-review
    evidence_level: L2-fixture-contract
    evidence_paths: [selected/pdf-page-24.png, selected/pdf-page-25.png]
    verification_commands: [RUNTIME_PY=... "$RUNTIME_PY" tests/run_fixture_contract_tests.py]
    diagnostics: [只验证视觉基准存在]
    unknown: [真实渲染器]
