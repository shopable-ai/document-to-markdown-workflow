registry: tool-registry
id: tool-registry
version: 0.1.0
human_reference: contracts/CONTRACTS.md#yaml-tool-registry
lifecycle_status: active
description: Skill 所依赖的确定性代码、系统能力和外部模型适配器注册表。
schema:
  required_entry_fields: [id, kind, used_by, implementation]
  implementation_values: [planned, optional, available]
  planned_is_not_production_ready: true
tools:
  - id: pdf-background-task-manager
    kind: local-detached-process-orchestrator
    used_by: [document-asset-extraction]
    implementation: available
    path: adapters/pdf_background_task.py
    contract: contracts/long-task-interaction.yaml
    commands: [start, status, cancel, resume]
    resume_support: [native-pdf, native-pdf-batch, hybrid-pdf, visual-pdf]
    task_type_selection: explicit-no-implicit-route-change
    stdout: one-compact-json-per-explicit-command
    worker_output: <task-root>/run.log
  - id: workflow-a-source-runner
    kind: local-deterministic-orchestrator
    used_by: [document-asset-extraction]
    implementation: available
    status: active-deterministic-execute
    contract: contracts/workflow-a-source-runner.yaml
    default_mode: execute
    plan_mode: explicit-diagnostic
    execute_promotion: promoted-for-deterministic-stages
    source_profiles: [references/profiles/source-runner-generic.yaml]
  - id: pptx-xml-parser
    kind: local-deterministic
    used_by: [pptx-xml-extraction]
    implementation: available
  - id: office-ppt-parser
    kind: local-deterministic
    used_by: [source-inventory, page-rendering]
    implementation: planned
    source_type: ppt
  - id: pdf-layout-parser
    kind: local-deterministic
    used_by: [pdf-layout-extraction]
    implementation: available
  - id: docx-ooxml-parser
    kind: local-deterministic
    used_by: [docx-structure-extraction]
    implementation: available
  - id: office-page-renderer
    kind: local-deterministic
    used_by: [page-rendering]
    implementation: available
  - id: embedded-media-reader
    kind: local-deterministic
    used_by: [embedded-media-extraction]
    implementation: available
  - id: image-region-cropper
    kind: local-deterministic
    used_by: [region-cropping]
    implementation: available
    execution_binding: adjacent-reader-package-crop-and-relink-script
    repository_entrypoint: skills/region-cropping/scripts/apply_reader_asset_crops.py
    orchestration_status: reader-only-adjacent-code-not-wired-to-figure-lifecycle
    lifecycle_compatibility: needs-review
    lifecycle_gaps: [no-region-localization-record, no-crop-decision-schema, no-single-manifest-update, deletes-regenerable-reader-page-image-after-relink]
    candidate_region_source: complex-region-detection-or-equivalent-human-approved-decision
    human_visual_approval: required
    reader_only_quality_gate: minimum-95-with-all-hard-checks-passed
    reader_only_source_deletion: regenerable-engineering-page-render-only-after-crop-relink-verification
    original_source_deletion: forbidden
  - id: reader-asset-text-auditor
    kind: local-deterministic
    used_by: [region-cropping, semantic-visual-asset-pruning, asset-package-validation]
    implementation: available
    repository_entrypoint: skills/region-cropping/scripts/audit_text_heavy_reader_assets.py
    default_ocr_route: apple-vision-then-tesseract
    model_tokens_default: 0
    output: evidence/text-heavy-reader-asset-audit.json
    plan_output: evidence/text-heavy-reader-asset-removal-plan.json
    apply_result: evidence/text-heavy-reader-asset-removal-result.json
    apply_mode: explicit-hash-locked-plan-only
    contract: contracts/visual-asset-pruning.yaml
    deletion_gate: candidate-remove-and-score-at-least-95-and-all-hard-gates
    lan_vision_role: needs-review-candidate-only-never-deletion-authority
    modes: [markdown-reader-assets, standalone-image-corpus]
    standalone_entrypoint: skills/region-cropping/scripts/audit_text_heavy_reader_assets.py --mode standalone-image-corpus
    standalone_implementation: skills/semantic-visual-asset-pruning/scripts/standalone_image_corpus.py
    standalone_evidence: [input-manifest.jsonl, classification.jsonl, deletion-ledger.jsonl, progress.json, summary.json, 最终验收报告.md]
    standalone_streaming: single-image-fsync-checkpoint-and-immediate-sha-locked-delete
    standalone_resume: on-disk-state-index-and-deleted-recovered
    standalone_concurrency: default-1-max-2
    automatic_restart: forbidden
  - id: system-ocr
    kind: local-system
    used_by: [local-ocr]
    implementation: available
  - id: mac96-vision-page-analysis
    kind: remote-local-network-model-adapter
    used_by: [vision-page-analysis]
    implementation: available
    transport: ssh
    target: mac96
    model_default: qwen3-vl:30b-a3b-instruct
    input_scope: one-current-page-or-region-image
    modes: [text, layout, full]
    default_mode: full
    default_pass_strategy: single
    output: evidence/vision-page-analysis.json
    contract: contracts/vision-page-analysis.yaml
  - id: conversation-online-vision-page-analysis
    kind: host-provided-current-conversation-vision-model
    used_by: [vision-page-analysis]
    implementation: optional
    transport: conversation
    target: current-conversation
    adapter: none-direct-current-vision-model
    authorization: current-task-explicit
    input_scope: one-current-page-or-region-image
    modes: [text, layout, full]
    output: evidence/vision-page-analysis.json
    contract: contracts/vision-page-analysis.yaml
  - id: language-quality-repair-adapter
    kind: remote-local-network-language-model-adapter
    used_by: [document-asset-extraction, markdown-content-repair]
    implementation: available
    path: adapters/markdown_content_repair.py
    transport: ssh
    target: mac96
    model_default: qwen3.6:latest
    input_scope: one-current-page-unit-only
    image_input: false
    online_fallback: current-conversation-explicit-only
    raw_layer_immutable: true
    output: evidence/markdown-content-repair-p<page-3-digits>.json
    contract: contracts/markdown-content-repair.yaml
  - id: page-markdown-noise-cleanup-adapter
    kind: local-deterministic
    used_by: [clean-page-markdown-noise, document-asset-extraction]
    implementation: available
    path: adapters/page_markdown_noise_cleanup.py
    input_scope: selected-page-unit-markdown-boundary-lines-and-current-files
    image_input: false
    default_mode: scan
    apply_mode: explicit --apply or registered mac96 runner pre-repair gate
    output: evidence/page-markdown-noise-cleanup.json
    contract: contracts/page-markdown-noise-cleanup.yaml
  - id: ebook-page-pruning-adapter
    kind: local-deterministic
    used_by: [prune-low-value-ebook-pages]
    implementation: available
    path: skills/prune-low-value-ebook-pages/scripts/prune_ebook_pages.py
    input_scope: one-complete-page-unit-directory-and-explicit-page-selection
    default_mode: preview
    apply_mode: exact-hash-locked-plan-only
    output: operator-selected-plan-path
    contract: contracts/ebook-page-pruning.yaml
  - id: markdown-writer
    kind: local-deterministic
    used_by: [markdown-structure-builder, source-asset-linker]
    implementation: available
  - id: manifest-writer
    kind: local-deterministic
    used_by: [source-occurrence-registration, asset-deduplication, asset-package-validation]
    implementation: available
  - id: prompt-template-renderer
    kind: local-deterministic
    used_by: [visual-prompt-builder]
    implementation: planned
  - id: gpt-image-2-provider-adapter
    kind: online-model-adapter
    used_by: [gpt-image-2-generation]
    implementation: planned
  - id: image-download-and-integrity-check
    kind: local-deterministic
    used_by: [gpt-image-2-generation, generated-image-review]
    implementation: planned
