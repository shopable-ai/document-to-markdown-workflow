  reference: ../../references/quality-targets.zh.md
stages:
  - id: A1
    name: 来源预检
    reader_name: 确认来源能不能读、该用哪份
    user_problem: 用户不知道来源是否完整可读，也不知道同名 PPTX/PDF 是独立文件还是同一逻辑文档候选。
    success_signal: 已记录来源指纹、类型、页数/尺寸、文字层、图像层、候选关系和可操作诊断。
    failure_visible_as: source-invalid、unsupported-format 或 needs-review；不创建空成功包，不用文件名或 HTTP 状态代替来源证据。
    type: stage
    skills: [source-inventory]
    route: local-first
    input: source_document
    output: transient source inventory (not written in reader-only mode)
    evidence: []
    engineering_output_only: true
    contract: ../../contracts/source-inventory.yaml
    gate: 可识别文件类型、页数/尺寸和文字层状态；默认 single-source；只有显式声明同一逻辑文档候选时才比较代表页；同名同页数候选优先 PDF 页面图，并记录 PPTX/PDF 各自的渲染差异；不可识别则 source-invalid
    required_fields: [source_fingerprint, media_type, status, page_count_or_dimensions, text_layer, image_layer, readability, source_selection, candidate_comparison, diagnostics]
    score_dimensions: [input-boundary, provenance, failure-diagnostics, runtime-evidence]
  - id: A2
    name: 原生内容提取
    reader_name: 把原文件里的文字和结构取出来
    user_problem: 只依赖已有 OCR/错误文本会让换一个文件就不可用，且会丢掉 PPTX 图表和布局关系。
    success_signal: PPTX XML 或 PDF 布局已按来源页保存文字、节点、关系、坐标和定位；DOCX 仍属未接入 active runner 的扩展路线。
    failure_visible_as: extract-timeout、contract-invalid 或字段级 Unknown；不能用固定示例文本填充其他来源。
    type: stage
    skills: [pptx-xml-extraction, pdf-layout-extraction]
    deferred_skills: [docx-structure-extraction]
    route: local-code
    output: transient native content model (not written in reader-only mode)
    evidence: []
    engineering_output_only: true
    contract: ../../contracts/native-content-model.yaml
    gate: 保留文本、节点、关系、坐标和来源定位；缺失字段显式 unknown
    required_fields: [source_fingerprint, status, text_blocks, nodes, relations, coordinates, source_locations, diagnostics]
    score_dimensions: [native-fidelity, structure-preservation, provenance, failure-diagnostics]
  - id: A3
    name: 视觉来源资产保留
    reader_name: 先把原页面和可复用素材保存下来
    user_problem: 解析文字正确不代表页面视觉可信；没有原图就无法发现错位、遮挡或后续复核。
    success_signal: 每个选定页面都有可打开且带来源定位的页面图，复杂区域和嵌入媒体按需保留。
    failure_visible_as: render-failed、integrity-check-failed 或缺失资产链接；不得以空目录宣称视觉保留完成。
    type: stage
    skills: [embedded-media-extraction, page-rendering, complex-region-detection, region-cropping]
    route: local-code
    output: assets/
    evidence: [assets/]
    conditional_evidence: [evidence/rendering.json, evidence/asset-registration.json]
    gate: 渲染生产者启动后，当前页只有在页面图可打开且已复制到扁平 assets/ 后才能启动该页 A4/A5；后续页可以与当前页模型处理并行生成；可读的已有页面图直接复用并跳过重渲染；页面图、嵌入媒体、按需复杂区域/crop 和可选 enhanced-raster 统一落在扁平 assets/，类型、父子派生、geometry、增强参数和来源位置由同一 manifest 的 asset_kind、derivation 与 source_occurrences 区分；裁切默认先锁横向再调纵向，增强只改善可读性且必须保留 crop fallback；没有区域裁剪需求时不创建空目录
    required_fields: [assets, coverage, renderer, status, diagnostics]
    score_dimensions: [visual-fidelity, coverage, provenance, integrity]
  - id: A4
    name: 页面视觉理解
    reader_name: 核对看得见的文字和图示关系
    user_problem: 原生结构与页面视觉可能冲突；同一张图片既可能需要 Markdown 文字，也可能需要图表和关系信息。
    success_signal: 文字识别、Markdown 结构重建和广告策略三层证据独立；标题、自然段、目录、列表、页眉页脚、标点、跨页连续性和异常文字保留通过页面质量守卫。
    failure_visible_as: raw-text-coverage-failed、structure-guard-failed、visual-analysis-unavailable、ocr-unavailable、silent-omission、hallucinated-structure、冲突或 needs-review；非空文字不能替代结构验收。
    type: stage
    skills: [vision-page-analysis, local-ocr, text-source-reconciliation, layout-relation-reconciliation]
    optional_skills: [visual-reconstruction-profile]
    fallback_skills: [local-ocr]
    route: recognition-calibration-then-page-quality-routing
    output: transient visual review; visual-reconstruction-profile.yaml only with --engineering-output
    evidence: []
    engineering_output_only: true
    conditional_evidence: [evidence/vision-page-analysis.json, evidence/visual-reconstruction-profile.yaml]
    contract: ../../contracts/reconciliation.yaml
    gate: 原生结构先行；扫描页必须把文字识别、Markdown 结构重建、广告分类及处理分开。Apple Vision OCR、小视觉模型和 30B 都是候选路线，按真实页面基准和页面质量守卫选择；非空输出、模型参数量或一次成功请求都不能决定主路线。标题、自然段、目录、列表、页眉页脚、标点、跨页连续性或异常文字保留失败时升级到下一条已校准且已授权路线。提取与结构重建阶段保留全部可见文字，广告策略默认 preserve-only，不删除或改写。可选 Mermaid 只消费已确认的节点、文字和边；任一结构未裁决时保留 PNG 并标记 needs-review，不回填 Mermaid。
    required_fields: [native_input, ocr_input, reconciled_items, conflicts, unresolved, unknown_forms, coverage_notes, status, diagnostics]
    score_dimensions: [source-separation, conflict-safety, relation-fidelity, reconstruction-traceability, reviewability]
  - id: A5
    name: Markdown 组装
    reader_name: 组装成读者能读、能检索的 Markdown
    user_problem: 工程诊断字段或图片先于正文会让读者无法使用，也会把错误解析结果伪装成内容。
    success_signal: 页面/章节语义完整，文字与关系先于视觉链接，来源与不确定性以读者可理解方式表达。
    failure_visible_as: markdown-section-missing、reader-semantic-content 失败或断链；不输出只剩关系表/占位标题的页面。
    type: stage
    skills: [markdown-structure-builder, page-markdown-unit, clean-page-markdown-noise, markdown-content-repair, source-asset-linker, uncertainty-marking, semantic-visual-asset-pruning]
    optional_skills: []
    route: local-deterministic-noise-cleanup-then-lan-language-model-then-explicit-conversation-fallback
    output: index.md
    evidence: [index.md]
    conditional_evidence: [evidence/page-markdown-noise-cleanup.json, reviews/markdown-content-repair.yaml]
    gate: 读者层 Markdown 写关键点，并只在 reader_image_policy 要求时附视觉资产；混合正文与局部复杂视觉必须为 crop-required，优先使用 OCR 坐标/图题/确定性布局生成最小充分 crop，不得把整页工程图直接留在 reader assets。图级升级只回填当前 page-unit/segment/content unit，Mermaid 可用时按 Mermaid → PNG fallback → 图题写入，不可用时只写 crop/enhanced PNG。page-unit 生成后先执行确定性页眉页脚清洗，scan 后才 apply，疑似正文行保留为 needs-review，页面图链接、Mermaid block、fallback 和保留行逐字不变，然后才允许进入语言模型内容修复。text-only 且 Markdown 足够时不得写整页截图，二维码不得解码、裁剪或作为图片链接。不得写入来源文件名、哈希、bbox、对象 ID、OCR/视觉诊断或工程路径。默认不生成 page-units、evidence、manifest 或 reports；需要语言修复、视觉复核或完整工程登记时，必须显式切换到后续工程输出路线。
    required_fields: [source_package_id, sections, links, unresolved, unknown_forms, reader_order, status]
    score_dimensions: [retrievability, semantic-structure, link-integrity, uncertainty-preservation]
  - id: A6
    name: 命名与来源登记
    reader_name: 给素材稳定名字并登记出处
    user_problem: 中文原文件名、同名资源和重复运行会造成覆盖，后续无法知道资产来自哪一页哪一次出现。
    success_signal: 短稳定 ASCII 语义文件名、中文显示名、source_occurrence_id、来源指纹和 SHA-256 一致。
    failure_visible_as: provenance-missing、dedup 冲突或 integrity-check-failed；不以目录中“有文件”代替登记。
    type: stage
    skills: [semantic-asset-naming, source-occurrence-registration, asset-deduplication, semantic-visual-asset-pruning]
    route: local-code
    output: optional assets/ (only semantic reader images referenced by index.md)
    evidence: [index.md]
    conditional_evidence: [assets/]
    engineering_output_only: true
    gate: file_name 使用 references/naming-policy.zh.md 的短语义格式、display_name 保留中文语义；稳定 ID、来源指纹、哈希、asset kind、用途、ordinal、source_occurrences、derivation、可选 Mermaid representation 和 markdown_bindings 进入同一个 manifest，命名不得依赖原始文件名或随机前缀；Workflow A manifest 包在 pruning 或 Markdown 引用缺失后仍须保留来源 page-render、派生资产登记和哈希；reader-only 简化包可在 crop/relink/result 全通过后删除可再生工程页图，但原始来源文件不可删
    required_fields: [manifest_version, package_id, source, assets, status, diagnostics]
    score_dimensions: [naming-stability, occurrence-traceability, dedup-safety, integrity]
  - id: A7
    name: 资产包验收
    reader_name: 重新读一遍结果并决定能否交付
    user_problem: runner 自报 complete、fixture 通过或文件存在都不能证明真实业务包可用。
    success_signal: 独立验收器重读包后给出 passed/needs-review/failed，并说明下一步动作。
    failure_visible_as: contract-invalid、provenance-missing、integrity-check-failed 或 P0 未解决；最终结论不可被总状态吞掉。
    type: stage
    skills: [asset-package-validation]
    route: local-code
    output: reader-package structural guard (runner stdout only)
    evidence: [index.md]
    conditional_evidence: [assets/]
    gate: 通过 workflows/document-to-markdown-assets/ACCEPTANCE.zh.md；存在图级升级时必须按 F0–F8 重读需求盘点、source page、候选区域、crop decision/四边复核、纯文字 reader crop 二次门、enhanced 比较、optional Mermaid 验证、同一 manifest/读者投影、Markdown binding/确定性再生成和批次闭合；二次门存在 needs-review、删除资格硬门失败或 audit evidence score<95 时不得 passed。存在复杂结构或重建意图时，profile 的结构/提示词/来源证据和 PNG fallback 也必须通过独立重读
    required_fields: [status, evidence_level, checks, failures, warnings, stage_evidence, repair_tasks, reaudit, recovery, diagnostics]
    score_dimensions: [contract-completeness, cross-stage-consistency, failure-safety, evidence-honesty]
profiles:
  - id: knowledge-map-image-to-md
    kind: compatibility-entrypoint
    entrypoint_skill: knowledge-map-image-to-md
    contract: ../../contracts/knowledge-map-profile.yaml
    policy_reference: ../../references/knowledge-map-profile.zh.md
    canonical_stage_order: [A1, A2, A3, A4, A5, A6, A7]
    no_independent_stages: true
failure_policy:
  no_empty_success: true
  page_isolation: one-page-failure-must-not-stop-later-selected-pages
  incomplete_page_action: retain-native-content-when-available;write-needs-review-or-failed-route;include-in-page-completion-report
  final_status: passed-only-when-all-selected-pages-are-complete-and-unique
  retryable_states: [extract-timeout, render-failed, ocr-unavailable, visual-review-unavailable]
  terminal_states: [source-invalid, unsupported-format, package-integrity-failed]
does_not_call:
  - gpt-image-2
  - pptx-export
  - pdf-export
